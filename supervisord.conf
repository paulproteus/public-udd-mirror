[supervisord]
nodaemon=true
user=root

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
priority=1

[program:postgres]
command=/usr/local/bin/start_postgres.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=1

[program:cron]
command=/usr/sbin/cron -f
priority=1

[program:certbot]
command=/usr/local/bin/renew_cert.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=2
